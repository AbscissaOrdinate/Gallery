name: Build desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Typecheck and tests run on every PR, so problems show before a merge rather than after.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    needs: test
    # The desktop build and its artefacts are for main, tags and manual runs, not every PR.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build installer (.exe / .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On a v* tag this also creates a GitHub Release with the installers attached.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Gallery {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false
      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/gallery.exe
          if-no-files-found: error
