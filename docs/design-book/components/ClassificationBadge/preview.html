<!-- @dsCard group="Foundations" height=300 width=900 subtitle="ACS-style badge block beside a record title: clearance, disruption class, risk class" -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--surface-100);color:var(--ink-100);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.lxs{font:600 10px/14px var(--font-sans);letter-spacing:.09em}
.lsm{font:600 11px/16px var(--font-sans);letter-spacing:.06em}
.lmd{font:500 13px/18px var(--font-sans)}
.bd{font:400 14px/20px var(--font-sans)}
.tsm{font:600 15px/20px var(--font-sans);letter-spacing:.02em}
.tmd{font:600 18px/24px var(--font-sans)}
.tlg{font:600 24px/28px var(--font-sans)}
.disp{font:600 34px/36px var(--font-sans);letter-spacing:-.01em}
.dxs{font:400 10px/14px var(--font-mono)}
.dsm{font:400 11px/16px var(--font-mono)}
.dmd{font:400 12px/18px var(--font-mono)}
.dlg{font:400 14px/20px var(--font-mono)}
.dxl{font:500 20px/24px var(--font-mono)}
.ban{font:700 12px/16px var(--font-mono);letter-spacing:.14em}
.stmp{font:700 11px/14px var(--font-mono);letter-spacing:.18em}
.asc{font:400 12px/12px var(--font-mono);white-space:pre}
.code{font:400 12px/20px var(--font-mono)}
.mut{color:var(--ink-200)}.met{color:var(--ink-300)}.dis{color:var(--ink-400)}
.acc{color:var(--accent-300)}.red{color:var(--status-red)}.amb{color:var(--status-amber)}.grn{color:var(--status-green)}
.nav{color:var(--glyph-navy)}
.panel{background:var(--surface-200);border:1px solid var(--line-200)}
.phead{background:var(--surface-300);border-bottom:1px solid var(--line-200);padding:0 12px;height:26px;display:flex;align-items:center;justify-content:space-between;color:var(--ink-200)}
.grp{background:var(--surface-300);border:1px solid var(--line-200)}
.fld{background:var(--surface-400);border:1px solid var(--line-200)}
.row{display:flex;align-items:center}
.hr{height:1px;background:var(--line-100)}
body{padding:20px}
.hd{display:flex;gap:16px;align-items:flex-start;max-width:820px;background:var(--surface-200);
    border:1px solid var(--line-200);padding:16px}
.ttl{flex:1;min-width:0}
.sub{margin-top:4px}
.codes{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-200);background:var(--surface-300);color:var(--ink-200);
      padding:1px 8px;border-radius:999px;height:20px;display:inline-flex;align-items:center}
.badge{background:var(--surface-300);border:1px solid var(--line-200);border-radius:2px;padding:10px 12px;
       display:grid;grid-template-columns:auto auto;gap:6px 16px;min-width:250px}
.badge .lxs{color:var(--ink-300)}
.v{text-align:right}
.sep{grid-column:1/-1;height:1px;background:var(--line-100)}
.note{margin-top:16px;max-width:820px;color:var(--ink-300)}
</style>
<div class="hd">
  <div class="ttl">
    <div class="tlg">CDF Mark The Time</div>
    <div class="tmd mut sub">Vauxhall-class Light Cruiser &middot; CL-140</div>
    <div class="codes">
      <span class="chip dsm">hull</span><span class="chip dsm">cruiser</span>
      <span class="chip dsm">railgun</span><span class="chip dsm">nuclear</span>
    </div>
  </div>
  <div class="badge">
    <span class="lxs">CLEARANCE</span><span class="stmp v">LEVEL 4</span>
    <div class="sep"></div>
    <span class="lxs">DISRUPTION</span><span class="stmp v amb">KENEQ</span>
    <div class="sep"></div>
    <span class="lxs">RISK</span><span class="stmp v red">CRITICAL</span>
    <div class="sep"></div>
    <span class="lxs">SURVEY</span><span class="stmp v grn">CURRENT</span>
  </div>
</div>
<p class="bd note">The badge block is the only element in Gallery with a corner radius. That is how a reader finds it without reading it.</p>
