<!-- @dsCard group="Controls" height=330 width=900 subtitle="Text field, numeric field with unit, select, checkbox and the invalid state" -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--surface-100);color:var(--ink-100);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.lxs{font:600 10px/14px var(--font-sans);letter-spacing:.09em}
.lsm{font:600 11px/16px var(--font-sans);letter-spacing:.06em}
.lmd{font:500 13px/18px var(--font-sans)}
.bd{font:400 14px/20px var(--font-sans)}
.tsm{font:600 15px/20px var(--font-sans);letter-spacing:.02em}
.tmd{font:600 18px/24px var(--font-sans)}
.tlg{font:600 24px/28px var(--font-sans)}
.disp{font:600 34px/36px var(--font-sans);letter-spacing:-.01em}
.dxs{font:400 10px/14px var(--font-mono)}
.dsm{font:400 11px/16px var(--font-mono)}
.dmd{font:400 12px/18px var(--font-mono)}
.dlg{font:400 14px/20px var(--font-mono)}
.dxl{font:500 20px/24px var(--font-mono)}
.ban{font:700 12px/16px var(--font-mono);letter-spacing:.14em}
.stmp{font:700 11px/14px var(--font-mono);letter-spacing:.18em}
.asc{font:400 12px/12px var(--font-mono);white-space:pre}
.code{font:400 12px/20px var(--font-mono)}
.mut{color:var(--ink-200)}.met{color:var(--ink-300)}.dis{color:var(--ink-400)}
.acc{color:var(--accent-300)}.red{color:var(--status-red)}.amb{color:var(--status-amber)}.grn{color:var(--status-green)}
.nav{color:var(--glyph-navy)}
.panel{background:var(--surface-200);border:1px solid var(--line-200)}
.phead{background:var(--surface-300);border-bottom:1px solid var(--line-200);padding:0 12px;height:26px;display:flex;align-items:center;justify-content:space-between;color:var(--ink-200)}
.grp{background:var(--surface-300);border:1px solid var(--line-200)}
.fld{background:var(--surface-400);border:1px solid var(--line-200)}
.row{display:flex;align-items:center}
.hr{height:1px;background:var(--line-100)}
body{padding:20px}
.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 28px;max-width:820px}
.f{display:block}
.f > .lsm{color:var(--ink-200);display:block;margin-bottom:4px}
.ip{height:26px;width:100%;background:var(--surface-400);border:1px solid var(--line-200);color:var(--ink-100);
    font:400 12px/18px var(--font-mono);padding:0 8px;display:flex;align-items:center}
.ip.hover{border-color:var(--line-300)}
.ip.ph{color:var(--ink-300)}
.ip.bad{border-color:var(--status-red-mark);background:var(--status-red-wash)}
.ip.dis{opacity:.4}
.unit{margin-left:auto;color:var(--ink-300)}
.caret{width:1px;height:14px;background:var(--accent-300);margin-left:1px}
.focwrap{position:relative}
.focwrap::after{content:"";position:absolute;inset:-3px;border:2px solid var(--focus);pointer-events:none}
.msg{margin-top:4px;display:block}
.sel::after{content:"\25BE";margin-left:auto;color:var(--ink-200)}
.cb{width:13px;height:13px;border:1px solid var(--line-200);background:var(--surface-400);display:inline-flex;
    align-items:center;justify-content:center;font:400 10px/10px var(--font-mono);color:var(--on-accent)}
.cb.on{background:var(--accent-500);border-color:var(--accent-500)}
.cbrow{display:flex;align-items:center;gap:8px;height:22px;color:var(--ink-100)}
</style>
<div class="cols">
  <label class="f"><span class="lsm">DESIGNATION</span>
    <div class="ip">CDF Mark The Time</div></label>

  <label class="f"><span class="lsm">HULL NUMBER</span>
    <div class="ip hover">CL-140<span class="caret"></span></div>
    <span class="dxs met msg">hover — line-300</span></label>

  <label class="f"><span class="lsm">DISPLACEMENT</span>
    <div class="ip">21,732<span class="unit">t</span></div></label>

  <label class="f"><span class="lsm">SURVEY DATE</span>
    <div class="ip ph">YYYY-MM-DD</div>
    <span class="dxs met msg">placeholder — ink-300</span></label>

  <label class="f"><span class="lsm">HULL CLASS</span>
    <div class="focwrap"><div class="ip sel">Vauxhall-class Light Cruiser</div></div>
    <span class="dxs acc msg">focus — 2px focus ring, 1px offset</span></label>

  <label class="f"><span class="lsm">CREW COMPLEMENT</span>
    <div class="ip bad">-14<span class="unit">berths</span></div>
    <span class="dsm red msg">VIOLATION — below minimum watch standing</span></label>

  <label class="f"><span class="lsm">REGISTRY LOCK</span>
    <div class="ip dis">ONI-TECH-0412</div>
    <span class="dxs dis msg">disabled — opacity-disabled</span></label>

  <div class="f"><span class="lsm" style="color:var(--ink-200);display:block;margin-bottom:4px">FLAGS</span>
    <div class="cbrow"><span class="cb on">&#10005;</span><span class="lmd">Classified hull form</span></div>
    <div class="cbrow"><span class="cb"></span><span class="lmd">Export controlled</span></div>
  </div>
</div>
